<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111210">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>ALK Hospitality · Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
<style>
.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;padding-block:40px 24px}
.intro h1{font-size:clamp(38px,4.4vw,58px);max-width:16ch}
.intro p{color:var(--muted);margin:0;max-width:40ch}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.legend button{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1px solid var(--line2);background:none;cursor:pointer;font-size:14px;color:var(--muted)}
.legend button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.legend button[aria-pressed=false] .m{opacity:.35}
.legend b{font-weight:500;color:var(--quiet);font-variant-numeric:tabular-nums}
.m{flex:none;display:inline-block;width:16px;height:16px;border-radius:50%}
.m.done{background:var(--red);border:2px solid #ffe6df}
.m.progress{border:3px solid var(--gold);background:radial-gradient(circle,var(--gold) 0 3px,transparent 3.5px)}
.m.open{border:2px dashed var(--steel);background:rgba(169,194,214,.12)}
.m.tbc{border:2px solid var(--quiet);background:#3a3b36}
.m.own{border-radius:2px;transform:rotate(45deg) scale(.82);background:#f1eee8;border:2px solid #111210;outline:1px solid #f1eee8}
.explore{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);border:1px solid var(--line);background:var(--panel)}
.mapwrap{padding:18px;border-inline-end:1px solid var(--line)}
.countries{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--quiet);margin-bottom:6px}
.view{min-height:36px;padding:0 2px;border:0;border-bottom:1px solid transparent;background:none;cursor:pointer;font-size:13px;color:var(--quiet)}
.view[aria-pressed=true]{color:var(--ink);border-color:var(--red)}
.view:hover{color:var(--ink)}
.cluster{position:absolute;z-index:3;transform:translate(-50%,-50%);min-height:44px;padding:0 14px 0 8px;display:flex;align-items:center;gap:8px;border:1px solid var(--red);background:rgba(17,18,16,.92);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
.cluster:hover{background:#2a1513}
.cluster.mini{min-height:0;width:32px;height:32px;padding:0;justify-content:center;border:0;background:none}
.cluster.mini .m{box-shadow:0 0 0 4px rgba(17,18,16,.6)}
.cluster.mini:hover .m{transform:scale(1.3)}
.pin b{position:absolute;top:50%;left:34px;transform:translateY(-50%);white-space:nowrap;font-weight:500;font-size:12px;color:var(--ink);text-shadow:0 1px 3px #000;pointer-events:none}
.pin.l b{left:auto;right:34px}
.pin.t b{left:50%;top:-6px;transform:translate(-50%,-100%)}
.pin.b b{left:50%;top:auto;bottom:-6px;transform:translate(-50%,100%)}
.list small.tbc{color:var(--red-ink)}
.stage{position:relative;aspect-ratio:960/560;direction:ltr;overflow:hidden;background:#0c0d0b}
.stage svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.stage svg:active{cursor:grabbing}
#sphere{fill:#121311}
.country{fill:#1e1f1b;stroke:#34352f;stroke-width:.6px;vector-effect:non-scaling-stroke}
.country.has{fill:#2a2b25;stroke:#6a6b60;stroke-width:1px}
.river{fill:none;stroke:#7d8a8f;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
.river.main{stroke-width:2px}.river.branch{stroke-width:1.3px}.river.lake{stroke-width:5px;opacity:.5}.river.ca.main{stroke-width:6px;opacity:.7}.river.ca.branch{stroke-width:3px;opacity:.7}
.geo-l{position:absolute;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.5px;color:var(--olive);white-space:nowrap;pointer-events:none;z-index:1}
.zoombtns{margin-inline-start:auto;display:flex;gap:6px}
.zb{width:36px;height:36px;border:1px solid var(--line2);background:none;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.zb:hover{border-color:var(--ink)}
.pin{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;z-index:2}
.pin .m{transition:transform .25s cubic-bezier(.16,1,.3,1);box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pin:hover .m,.pin[aria-pressed=true] .m{transform:scale(1.35)}
.nopins{position:absolute;inset:auto 0 12px;margin:0 auto;width:max-content;max-width:90%;padding:8px 14px;background:rgba(17,18,16,.92);border:1px solid var(--line2);font-size:13px;color:var(--muted);text-align:center;z-index:4}
.cluster .dots{display:flex;gap:4px}
.pin.own:hover .m,.pin.own[aria-pressed=true] .m{transform:rotate(45deg) scale(1.1)}
.pin[aria-pressed=true]::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid var(--ink);animation:ring 2.4s cubic-bezier(.16,1,.3,1) infinite}
.pin[hidden]{display:none}
.pin::before,.cluster.mini::before{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:1px solid var(--halo,#a9a79f);opacity:0;animation:halo 3.2s cubic-bezier(.16,1,.3,1) infinite;pointer-events:none}
.pin.done{--halo:var(--red)}.pin.progress{--halo:var(--gold)}.pin.open{--halo:var(--steel)}.pin.own{--halo:var(--ink)}
.pin:nth-child(3n+2)::before{animation-delay:-1.1s}.pin:nth-child(3n)::before{animation-delay:-2.2s}
.cluster.mini::before{width:20px;height:20px;margin:-10px 0 0 -10px;--halo:var(--red-ink)}
@keyframes halo{0%{opacity:.75;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
.pin.mine .m{animation:pop .9s cubic-bezier(.16,1,.3,1)}
@keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
.side{padding:22px;display:flex;flex-direction:column;min-height:0}
.card .top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--olive)}
.card h2{font-size:34px;margin-top:12px}
.card .city{color:var(--muted);font-size:14px;margin:4px 0 0}
.card .work{margin:14px 0 0;color:#dedbd3}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:13px;padding:3px 9px;border:1px solid var(--line2);color:#cfccc4}
.flag{display:inline-block;margin-top:12px;font-size:13px;color:var(--red-ink)}
.list{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--line);overflow:auto;max-height:280px}
.list button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:start;color:var(--muted);font-size:15px}
.list button:hover,.list button[aria-current=true]{color:var(--ink)}
.list small{margin-inline-start:auto;color:var(--quiet);font-size:13px}
.samplenote{margin:12px 0 0}
/* join */
.join{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:48px}
.join h2{font-size:clamp(34px,3.6vw,48px)}
.join>div>p{color:var(--muted);margin:14px 0 0;max-width:40ch}
.steps{display:flex;gap:0;list-style:none;margin:0 0 22px;padding:0;border:1px solid var(--line)}
.steps li{flex:1;padding:12px 14px;font-size:14px;color:var(--quiet);border-inline-end:1px solid var(--line)}
.steps li:last-child{border:0}
.steps li[aria-current=step]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--red)}
.steps li.ok{color:var(--muted)}
.pane{border:1px solid var(--line);background:var(--panel);padding:26px}
.pane[hidden]{display:none}
.pane h3{font-size:30px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.linkbtn{background:none;border:0;padding:0;margin-top:16px;color:var(--steel);text-decoration:underline;cursor:pointer;font-size:14px;min-height:44px;text-align:start}
.ok-line{display:flex;align-items:center;gap:10px;color:var(--ink);margin:0 0 6px}
@media(max-width:980px){.explore{grid-template-columns:minmax(0,1fr)}.mapwrap{border-inline-end:0;border-bottom:1px solid var(--line)}.join{grid-template-columns:minmax(0,1fr);gap:24px}}
@media(max-width:600px){.pin b{display:none}.mapwrap{padding:8px}.steps li{padding:10px 8px;font-size:13px}.pane{padding:18px}}
</style>
</head>

<script>
{
const ORDER = ["done", "progress", "open", "own", "tbc"];
const show = {done:true, progress:true, open:true, own:true, tbc:true};
let places = PLACES.slice(), cur = 0, join = {}, step = 1;
/* places with confirm:true are shown as "Status to confirm" until confirmed */
const st = p => p.confirm ? "tbc" : p.status;
const inCairo = p => p.lat >= CAIRO.lat0 && p.lat <= CAIRO.lat1 && p.lng >= CAIRO.lng0 && p.lng <= CAIRO.lng1;
/* the demo point is only kept in this browser, and only in demo mode */
if (!LIVE) try { const m = JSON.parse(localStorage.getItem("alk-mine") || "null"); if (m && m.mine) { places.push(m); join = m; } } catch (e) {}

/* ---------- world map: d3 + world-atlas (Natural Earth), zooms from the planet onto Egypt ---------- */
const RIVERS = [{"cls":"eg main","lines":[[[32.8989,24.09],[32.9506,24.47],[32.8697,24.98],[32.6404,25.69],[32.7303,26.16],[32.2494,26.05],[31.7011,26.56],[31.1798,27.18],[30.7506,28.1],[31.1011,29.07],[31.2292,30.05]]]},{"cls":"eg branch","lines":[[[31.2292,30.05],[30.8494,30.6],[30.5506,31.1],[30.4,31.45]],[[31.2292,30.05],[31.3011,30.8],[31.6,31.2],[31.8,31.52]]]},{"cls":"eg lake","lines":[[[32.8989,24.09],[32.7506,23.6],[32.2989,23.0],[31.8,22.4],[31.4562,22.07]]]},{"cls":"ca main","lines":[[[31.25498,29.94002],[31.235,29.97998],[31.22496,30.00999],[31.22204,30.02997],[31.22697,30.04497],[31.22998,30.05997],[31.23299,30.07498],[31.24503,30.10001],[31.25498,30.13002],[31.262,30.177]]]},{"cls":"ca branch","lines":[[[31.22396,30.03999],[31.21401,30.055],[31.21602,30.07],[31.23098,30.08003]]]}];
const LABELS = [["med",28.6,32.55,"eg"],["red",35.6,25.2,"eg"],["sinai",33.8,29.5,"eg"],["nile",31.6,26.6,"eg"],["pyr",31.11056,29.95747,"ca"],["zam",31.13246,30.08856,"ca"],["dt",31.2474,30.0017,"ca"],["hel",31.3514,30.12962,"ca"],["nc",31.42439,29.96537,"ca"],["zay",30.98649,29.9938,"ca"],["nile",31.25105,29.95195,"ca"]];
const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json";
const HAS_PLACES = ["818", "250"];     /* ISO numeric codes of countries highlighted on the map (818 = Egypt, 250 = France) */
const W = 960, H = 560;
const BOUNDS = {egypt:[[24.7, 22], [36.9, 31.7]], cairo:[[CAIRO.lng0, CAIRO.lat0], [CAIRO.lng1, CAIRO.lat1]]};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let ready = false, proj, svgSel, zoom, tr = {k:1, x:0, y:0}, kEg = 20, kCa = 300;
const mid = () => Math.sqrt(kEg * kCa);
const viewOf = k => k < kEg * .5 ? "world" : k < mid() ? "egypt" : "cairo";

function boxTransform(b, maxK){
  const [x0, y0] = proj([b[0][0], b[1][1]]), [x1, y1] = proj([b[1][0], b[0][1]]);
  const k = Math.min(maxK || Infinity, .9 / Math.max((x1 - x0) / W, (y1 - y0) / H));
  return d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k);
}
function goTo(transform, dur){ if (ready) svgSel.transition().duration(reduce ? 0 : dur).call(zoom.transform, transform); }
function zoomView(v, dur = 1400){ if (ready) goTo(v === "world" ? d3.zoomIdentity : boxTransform(BOUNDS[v]), dur); }
function zoomPoint(p, k, dur = 1200){ if (!ready || p.noPin) return; const [x, y] = proj([p.lng, p.lat]); k = Math.max(tr.k, k); goTo(d3.zoomIdentity.translate(W / 2 - k * x, H / 2 - k * y).scale(k), dur); }

async function initMap(){
  try {
    if (!window.d3 || !window.topojson) throw new Error("map libraries missing");
    const topo = await (await fetch(WORLD_URL)).json();
    const world = topojson.feature(topo, topo.objects.countries);
    proj = d3.geoNaturalEarth1().fitExtent([[8, 8], [W - 8, H - 8]], {type:"Sphere"});
    const path = d3.geoPath(proj), zl = d3.select("#zl");
    zl.select("#sphere").attr("d", path({type:"Sphere"}));
    zl.select("#countries").selectAll("path").data(world.features).join("path").attr("class", f => "country" + (HAS_PLACES.includes(String(f.id)) ? " has" : "")).attr("d", path);
    zl.select("#rivers").selectAll("path").data(RIVERS).join("path").attr("class", r => "river " + r.cls).attr("d", r => path({type:"MultiLineString", coordinates:r.lines}));
    kEg = boxTransform(BOUNDS.egypt).k; kCa = boxTransform(BOUNDS.cairo).k;
    zoom = d3.zoom().scaleExtent([1, kCa * 3]).translateExtent([[-W * .1, -H * .1], [W * 1.1, H * 1.1]])
      /* page scroll stays page scroll: wheel zooms only with Ctrl/⌘ (or a trackpad pinch), touch needs two fingers */
      .filter(e => e.type === "wheel" ? (e.ctrlKey || e.metaKey) : e.type.startsWith("touch") ? e.touches.length > 1 : !e.button)
      .on("zoom", e => { tr = e.transform; zl.attr("transform", tr); place(); })
      .on("end", () => {
        /* highlight World / Egypt / Greater Cairo only when the map is really showing that place */
        const [lng, lat] = proj.invert([(W / 2 - tr.x) / tr.k, (H / 2 - tr.y) / tr.k]), v = viewOf(tr.k);
        const inside = b => lng >= b[0][0] && lng <= b[1][0] && lat >= b[0][1] && lat <= b[1][1];
        const on = v === "world" || inside(BOUNDS[v]) ? v : "";
        document.querySelectorAll(".view").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === on));
      });
    svgSel = d3.select("#map").call(zoom);
    $("map").style.touchAction = "pan-y";
    ready = true; renderLabels(); place();
    /* start on the whole planet, then fly to Egypt, where most points are today */
    if (reduce) zoomView("egypt", 0); else setTimeout(() => zoomView("egypt", 2800), 700);
  } catch (e) { $("mapFail").hidden = false; }
}
function renderLabels(){
  if (!ready) return; const d = t();
  $("labels").innerHTML = LABELS.map(([key, lng, lat, g], n) => `<span class="geo-l" data-n="${n}" data-g="${g}">${esc(d.geo[key])}</span>`).join("");
  place();
}
function screen(p){ const s = $("stage").clientWidth / W, [x, y] = proj([p.lng, p.lat]); return [(x * tr.k + tr.x) * s, (y * tr.k + tr.y) * s]; }
function place(){
  if (!ready) return;
  const d = t(), k = tr.k, sw = $("stage").clientWidth, sh = $("stage").clientHeight, m = mid();
  const showG = g => g === "eg" ? (k >= kEg * .5 && k < m) : k >= m;
  d3.selectAll(".river.eg").attr("display", k < m ? null : "none");
  d3.selectAll(".river.ca").attr("display", k >= m ? null : "none");
  document.querySelectorAll(".geo-l").forEach(el => { const L = LABELS[+el.dataset.n], [x, y] = screen({lng:L[1], lat:L[2]}); el.hidden = !showG(L[3]); el.style.left = x + "px"; el.style.top = y + "px"; });
  /* below the Cairo zoom, pins closer than 26px are grouped; a group zooms in when clicked */
  const vis = places.map((p, i) => ({p, i})).filter(o => show[st(o.p)] && !o.p.noPin).map(o => ({...o, xy:screen(o.p)}));
  const groups = [];
  /* from the Greater Cairo zoom on, every point is shown on its own */
  const radius = k >= m ? 0 : 26;
  vis.forEach(o => { const g = radius && groups.find(g => Math.hypot(g.xy[0] - o.xy[0], g.xy[1] - o.xy[1]) < radius); g ? g.m.push(o) : groups.push({xy:o.xy, m:[o]}); });
  const labels = k >= m && sw > 600;
  $("pins").innerHTML = groups.filter(g => g.xy[0] > -30 && g.xy[0] < sw + 30 && g.xy[1] > -30 && g.xy[1] < sh + 30).map((g, n) => {
    if (g.m.length === 1) return pinHtml(g.m[0].p, g.m[0].i, g.xy[0], g.xy[1], labels);
    const sts = ORDER.filter(s => g.m.some(o => st(o.p) === s)), allCairo = g.m.every(o => inCairo(o.p));
    /* grouped points: just a dot, no label box; clicking it zooms in */
    return `<button class="cluster mini" type="button" data-g="${n}" style="left:${g.xy[0]}px;top:${g.xy[1]}px" aria-label="${allCairo ? d.cluster(g.m.length) : g.m.length}"><span class="m ${sts[0]}" aria-hidden="true"></span></button>`;
  }).join("");
  const shown = groups.filter(g => g.xy[0] > -30 && g.xy[0] < sw + 30 && g.xy[1] > -30 && g.xy[1] < sh + 30);
  document.querySelectorAll("#pins .pin").forEach(b => { const i = +b.dataset.i; b.onclick = () => card(i, true); b.onmouseenter = () => card(i, false); b.onfocus = () => card(i, true); });
  document.querySelectorAll("#pins .cluster").forEach(b => b.onclick = () => {
    if (viewOf(tr.k) === "world" && shown[+b.dataset.g].m.every(o => inCairo(o.p))) return zoomView("egypt", 2000);
    const ps = shown[+b.dataset.g].m.map(o => o.p), lng = ps.map(p => p.lng), lat = ps.map(p => p.lat);
    const pad = .02, box = [[Math.min(...lng) - pad, Math.min(...lat) - pad], [Math.max(...lng) + pad, Math.max(...lat) + pad]];
    goTo(boxTransform(box, kCa * 2), 1400);
  });
  $("noPins").hidden = vis.length > 0;
}
function pinHtml(p, i, x, y, label){
  const d = t(), s = st(p);
  return `<button class="pin ${s}${p.mine ? " mine" : ""} ${p.lab || "r"}" data-i="${i}" type="button" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px" aria-label="${esc(p.name)}, ${esc(where(p))}, ${d.st[s]}" aria-pressed="${i === cur}"><span class="m ${s}"></span>${label ? `<b>${esc(p.name)}</b>` : ""}</button>`;
}

function where(p){ const d = t(); return p.area ? d.areas[p.area] : p.city ? d.cities[p.city] : p.cityName ? `${p.cityName}, ${countryName(p.country, LANG)}` : d.noAddr; }
function card(i, announce){
  cur = i; const d = t(), p = places[i], s = st(p);
  const c = $("card");
  c.setAttribute("aria-live", announce ? "polite" : "off");
  const work = p.status === "own" ? d.ownLine : p.mine ? (p.date ? `${d.fDate}: ${esc(p.date)} · ${esc(p.slot)}` : "") : d.workTbc;
  c.innerHTML = `<div class="top"><span class="m ${s}" aria-hidden="true"></span><span>${d.st[s]}</span></div>
    <h2>${esc(p.name)}</h2><p class="city">${esc(where(p))} · ${d.types[p.type]}</p>
    <p class="work">${work}</p>
    ${p.noPin && !p.mine ? `<span class="flag">${d.noAddr}</span>` : ""}
    <p style="margin:12px 0 0;display:flex;gap:18px;flex-wrap:wrap">${p.map ? `<a href="${p.map}">${d.gmaps}</a>` : ""}${p.ig ? `<a href="${p.ig}">${d.visitIg}</a>` : ""}</p>`;
  document.querySelectorAll(".pin").forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === i));
  document.querySelectorAll("#list button").forEach(b => b.setAttribute("aria-current", +b.dataset.i === i));
}
function renderMap(){
  const d = t();
  $("legend").innerHTML = ORDER.filter(s => s !== "tbc" || places.some(p => st(p) === "tbc")).map(s => `<button type="button" data-s="${s}" aria-pressed="${show[s]}"><span class="m ${s}" aria-hidden="true"></span>${d.st[s]} <b>${places.filter(p => st(p) === s).length}</b></button>`).join("");
  $("list").innerHTML = places.map((p, i) => show[st(p)] ? `<li><button type="button" data-i="${i}" aria-current="false"><span class="m ${st(p)}" aria-hidden="true"></span>${esc(p.name)}<small${p.noPin && !p.mine ? ' class="tbc"' : ""}>${esc(p.noPin && !p.mine ? d.noAddr : where(p).split(/[,،]/)[0])}</small></button></li>` : "").join("");
  document.querySelectorAll("#list button").forEach(b => b.onclick = () => { const i = +b.dataset.i, p = places[i]; zoomPoint(p, inCairo(p) ? kCa : kEg * 2); card(i, true); });
  document.querySelectorAll("#legend button").forEach(b => b.onclick = () => { show[b.dataset.s] = !show[b.dataset.s]; if (!ORDER.some(s => show[s])) show[b.dataset.s] = true; renderMap(); });
  if (!show[st(places[cur])]) { const k = places.findIndex(p => show[st(p)]); if (k > -1) cur = k; }
  $("zin").setAttribute("aria-label", d.zoomIn); $("zin").title = d.zoomIn;
  $("zout").setAttribute("aria-label", d.zoomOut); $("zout").title = d.zoomOut;
  renderLabels(); place();
  card(cur, false);
}
document.querySelectorAll(".view").forEach(b => b.addEventListener("click", () => zoomView(b.dataset.v)));
$("zin").onclick = () => { if (ready) svgSel.transition().duration(reduce ? 0 : 400).call(zoom.scaleBy, 2); };
$("zout").onclick = () => { if (ready) svgSel.transition().duration(reduce ? 0 : 400).call(zoom.scaleBy, .5); };
new ResizeObserver(() => place()).observe($("stage"));
initMap();

/* join flow */
const localDay = (plusDays) => { const x = new Date(); x.setDate(x.getDate() + plusDays); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const newRef = () => "ALK-" + Math.random().toString(36).slice(2, 7).toUpperCase();
const validContact = v => { const c = v.replace(/[\s\-().]/g, ""); return /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v.trim()) || /^\+?\d{8,15}$/.test(c); };
const calMode = () => !!SETTINGS.CALENDAR_LINK;

/* sends the file to SETTINGS.FORM_ENDPOINT (JSON). In demo mode nothing is sent. */
async function send(stage, btn, errId){
  if (!LIVE) return true;
  const d = t(), label = btn.textContent;
  btn.disabled = true; btn.textContent = d.sending; $(errId).textContent = "";
  try {
    const r = await fetch(SETTINGS.FORM_ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json", "Accept":"application/json"},
      body:JSON.stringify({stage, reference:join.ref, restaurant:join.name, country:countryName(join.country, "en"), country_code:join.country, city:join.cityName, person:join.person, contact:join.contact, need:T.en.needs[join.need], visit_date:join.date || "", visit_time:join.slot || "", calendar:calMode(), language:LANG})});
    if (!r.ok) throw new Error(r.status);
    return true;
  } catch (e) { $(errId).textContent = d.eSend; return false; }
  finally { btn.disabled = false; btn.textContent = label; }
}
function go(n){
  step = n; ["p1", "p2", "p3", "p4"].forEach((id, k) => $(id).hidden = k + 1 !== n);
  document.querySelectorAll("#stepper li").forEach((li, k) => { li.className = k + 1 < n ? "ok" : ""; li.removeAttribute("aria-current"); if (k + 1 === Math.min(n, 3)) li.setAttribute("aria-current", "step"); });
}
function when(){ return join.date ? t().at(join.date, join.slot) : ""; }
function renderJoin(){
  const d = t();
  const country = $("j-country").value || "EG";
  const names = COUNTRIES.map(c => [c, countryName(c, LANG)]).sort((a, b) => a[1].localeCompare(b[1], LANG));
  const eg = names.find(n => n[0] === "EG");
  $("j-country").innerHTML = [eg].concat(names.filter(n => n[0] !== "EG")).map(([c, n]) => `<option value="${c}"${c === country ? " selected" : ""}>${esc(n)}</option>`).join("");
  cityMode();
  const city = $("j-city").value || "cairo";
  $("j-city").innerHTML = Object.keys(CITIES).map(k => `<option value="${k}"${k === city ? " selected" : ""}>${d.cities[k]}</option>`).join("");
  const need = $("j-need").selectedIndex;
  $("j-need").innerHTML = d.needs.map(n => `<option>${esc(n)}</option>`).join(""); if (need > 0) $("j-need").selectedIndex = need;
  const slot = $("j-slot").selectedIndex;
  $("j-slot").innerHTML = d.slots.map(s => `<option>${s}</option>`).join(""); if (slot > 0) $("j-slot").selectedIndex = slot;
  $("p2name").textContent = join.name || "";
  $("payRef").textContent = LIVE && join.ref ? d.payRef(join.ref) : "";
  $("paidLine").textContent = LIVE ? d.paidLineLive : d.paidLine;
  $("bookLead").textContent = calMode() ? d.bookLeadCal : d.bookLead;
  $("bookBtn").textContent = calMode() ? d.calDone : d.book;
  if (join.name && step === 4) $("doneBody").textContent = LIVE ? d.doneLive(join.name, when()) : d.doneBody(join.name, when());
  $("demoNote").hidden = LIVE;
  $("demoPay").hidden = LIVE;
  $("payNext").hidden = !LIVE;
  $("showMine").hidden = LIVE;
  ["name", "cityText", "person", "contact", "date", "send1", "send3"].forEach(k => { $("e-" + k).textContent = ""; });
}
const isEgypt = () => $("j-country").value === "EG";
function cityMode(){ $("cityPick").hidden = !isEgypt(); $("cityFree").hidden = isEgypt(); }
$("j-country").addEventListener("change", cityMode);
function check(fields){
  let first = null;
  fields.forEach(([k, ok, msg]) => { const f = $("j-" + k); f.setAttribute("aria-invalid", !ok); $("e-" + k).textContent = ok ? "" : msg; if (!ok && !first) first = f; });
  if (first) first.focus(); return !first;
}
$("p1").addEventListener("submit", async e => {
  e.preventDefault(); const d = t();
  const v = k => $("j-" + k).value.trim();
  if (!check([["name", v("name").length > 1, d.eReq], ...(isEgypt() ? [] : [["cityText", v("cityText").length > 1, d.eCity]]), ["person", v("person").length > 1, d.eReq], ["contact", validContact(v("contact")), d.eContact]])) return;
  join = {ref:join.ref || newRef(), name:v("name"), country:$("j-country").value, city:isEgypt() ? $("j-city").value : "", cityName:isEgypt() ? T.en.cities[$("j-city").value] : v("cityText"), person:v("person"), contact:v("contact"), need:$("j-need").selectedIndex};
  if (!await send("file", $("next1"), "e-send1")) return;
  $("p2name").textContent = join.name;
  $("payRef").textContent = LIVE ? d.payRef(join.ref) : "";
  const pay = $("payBtn");
  if (SETTINGS.REVOLUT_PAYMENT_LINK) { pay.href = SETTINGS.REVOLUT_PAYMENT_LINK; pay.removeAttribute("aria-disabled"); pay.style.opacity = ""; pay.style.cursor = ""; }
  else { pay.removeAttribute("href"); pay.setAttribute("aria-disabled", "true"); pay.style.opacity = ".45"; pay.style.cursor = "not-allowed"; }
  go(2);
});
$("back1").onclick = () => go(1);
function toBooking(){
  const tomorrow = localDay(1);
  $("j-date").min = tomorrow; if (!$("j-date").value || $("j-date").value < tomorrow) $("j-date").value = tomorrow;
  $("calWrap").hidden = !calMode(); $("slotWrap").hidden = calMode();
  if (calMode()) $("calBtn").href = SETTINGS.CALENDAR_LINK;
  go(3); (calMode() ? $("calBtn") : $("j-date")).focus();
}
$("demoPay").onclick = toBooking;
$("payNext").onclick = toBooking;
$("p3").addEventListener("submit", async e => {
  e.preventDefault(); const d = t();
  if (calMode()) { join.date = ""; join.slot = ""; }
  else {
    if (!check([["date", !!$("j-date").value && $("j-date").value >= $("j-date").min, d.eReq]])) return;
    join.date = $("j-date").value; join.slot = $("j-slot").value;
  }
  if (!await send("visit", $("bookBtn"), "e-send3")) return;
  if (LIVE) {
    $("doneBody").textContent = d.doneLive(join.name, when());
  } else {
    const c = CITIES[join.city];
    Object.assign(join, {status:"open", type:"restaurant", mine:true}, c ? {lat:c[0] + .004, lng:c[1] - .006} : {noPin:true, lat:0});
    try { localStorage.setItem("alk-mine", JSON.stringify(join)); } catch (err) {}
    places = PLACES.concat(join); cur = places.length - 1;
    $("doneBody").textContent = d.doneBody(join.name, when());
    renderMap();
  }
  go(4);
});
$("showMine").onclick = () => { show.open = true; renderMap(); const p = places[places.length - 1]; zoomPoint(p, inCairo(p) ? kCa : kEg * 2); card(places.length - 1, true); $("explore").scrollIntoView({block:"start"}); };

go(1);
initLang(() => { renderMap(); renderJoin(); });
}
</script>
